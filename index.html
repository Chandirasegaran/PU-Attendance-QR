<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Attendance QR · Pondicherry University</title>
  <meta name="description" content="Generate and download your attendance QR code — Department of Computer Science, Pondicherry University.">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#f4f6fb" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0f1420" media="(prefers-color-scheme: dark)">
  <link rel="icon" href="assets/favicon.ico" sizes="any">
  <link rel="apple-touch-icon" href="assets/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- Fonts load without blocking first paint; system fonts are used until they arrive. -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@600&display=swap" media="print" onload="this.media='all'">
  <link rel="stylesheet" href="css/style.css">
  <script src="vendor/qrcode-generator-1.4.4.js" defer></script>
  <script src="js/logo-data.js" defer></script>
  <script src="js/app.js" defer></script>
</head>
<body>
  <main class="shell">
    <header class="brand">
      <img src="assets/logo.png" alt="Pondicherry University logo" width="72" height="72">
      <div>
        <p class="brand__uni">Pondicherry University</p>
        <p class="brand__dept">Department of Computer Science</p>
      </div>
    </header>

    <section class="card" aria-labelledby="title">
      <div class="card__form">
        <h1 id="title">Get your attendance QR</h1>
        <p class="lead">Enter your register number. The QR is generated on your device — nothing is uploaded.</p>

        <form id="qr-form" novalidate>
          <label class="field">
            <span class="field__label">Register number</span>
            <input id="reg-no" name="regNo" type="text" inputmode="numeric" autocomplete="off"
                   pattern="\d{6,12}" maxlength="12" placeholder="e.g. 22370001" required
                   aria-describedby="reg-hint">
            <span class="field__hint" id="reg-hint">Digits only, 6–12 characters.</span>
          </label>

          <label class="field">
            <span class="field__label">Name <span class="optional">(optional, printed under the QR)</span></span>
            <input id="name" name="name" type="text" autocomplete="name" maxlength="40" placeholder="Your name">
          </label>

          <div class="actions">
            <button type="submit" class="btn btn--primary" id="download" disabled>
              <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M12 3v12m0 0-5-5m5 5 5-5M5 21h14"/></svg>
              Download PNG
            </button>
            <button type="button" class="btn btn--ghost" id="share" hidden disabled>
              <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M4 12v7a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-7M16 6l-4-4-4 4M12 2v14"/></svg>
              Share
            </button>
          </div>
        </form>
      </div>

      <figure class="card__preview">
        <div class="preview" id="preview" data-state="empty">
          <canvas id="qr-canvas" width="1080" height="1440" aria-label="Attendance QR code preview" role="img"></canvas>
          <p class="preview__placeholder">Your QR will appear here</p>
        </div>
        <figcaption id="status" class="status" role="status" aria-live="polite"></figcaption>
      </figure>
    </section>
  </main>
</body>
</html>
